<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>蒼阿祭ライブ2026 "蒼を照らせ"</title>
        <link rel="icon" href="favicon.ico" sizes="any">
        <link rel="icon" href="images/favicon.png" type="image/png">
        <script src="index.js"></script>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header class="site-header">
            <a class="site-title" href="./">
                <img src="images/title.webp" alt="蒼を照らせ">
            </a>
        </header>
        <section class="hero">
            <div class="hero-frame">
                <img class="hero-bg" src="images/top.webp" alt="ステージで演奏する軽音部のメンバー">
                <div class="hero-text">
                    <h1 class="hero-title">
                        <img class="title-sub" src="images/subtitle.webp" alt="K-ON School Fes. LIVE 2026">
                        <img class="title-main" src="images/title.webp" alt="蒼を照らせ">
                    </h1>
                    <div class="hero-info">
                        <img src="images/info.webp" alt="@1-1HR 11.07 Sat. 9:00 START!!">
                    </div>
                </div>
            </div>
        </section>
        <h2>About<span class="h2-ja">-開催情報-</span></h2>
        <p>
            今年も蒼阿祭の季節がやってきた！<br>
            今年の蒼阿祭のテーマが<br>
            「蒼春(アオハル)」ということで，<br>
            ライブタイトルも「蒼を照らせ」としました。<br>
            蒼春に満ち溢れたsoundを響かせます。
        </p>
        <dl class="info-box">
            <div class="info-row">
                <dt>場所</dt>
                <dd>1年1組教室</dd>
            </div>
            <div class="info-row">
                <dt>日付</dt>
                <dd>2026年11月7日 (土)</dd>
            </div>
            <div class="info-row">
                <dt>時間</dt>
                <dd>9:00 開場/開演 ～ 17:00 終演(予定)</dd>
            </div>
        </dl>

        <h2>Lineup<span class="h2-ja">-出演者情報-</span></h2>
        <h2>Setlist</h2>
        <footer class="site-footer">
            <img src="images/title.webp" alt="蒼を照らせ">
        </footer>
    </body>
</html>
